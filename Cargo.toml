[package]
name = "vibe-httpd"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
description = "The vibeOS HTTP server"
repository = "https://github.com/vibedOS/vibe-httpd"

[dependencies]
vibe-rt = { git = "https://github.com/vibedOS/vibe-rt", rev = "0b60a80c0946fb2929a77d9c2c0541e98cee198c" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
strip = "symbols"
