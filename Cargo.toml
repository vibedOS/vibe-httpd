[package]
name = "vibe-httpd"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
description = "The vibeOS HTTP server"
repository = "https://github.com/vibedOS/vibe-httpd"

[dependencies]
vibe-rt = { git = "https://github.com/vibedOS/vibe-rt", rev = "62b8de766056ab5e5000d54271fea7d400b1cf66" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
strip = "symbols"
